[project]
name = "dsxlineage"
version = "0.1.0"
description = "IBM DataStage .dsx lineage analysis backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "celery==5.3.6",
    "redis==5.0.1",
    "python-multipart==0.0.6",
    "langgraph>=0.0.26",
    "langchain>=0.1.0",
    "openai>=1.3.0",
    "langchain-openai>=0.0.2",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.5.0,<3",
    "neo4j>=5.15.0,<6",
    "openpyxl>=3.1.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsxlineage"]
