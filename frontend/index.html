<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DataWise — IBM DataStage lineage explorer by ML arteka" />
    <meta name="theme-color" content="#ea580c" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <title>DataWise · Lineage Explorer</title>
    <script>
      // Apply persisted theme before first paint to avoid a light->dark flash.
      if (
        localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // tailwind.config must be set AFTER the CDN script has defined `window.tailwind`.
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            keyframes: {
              'march-x': { to: { backgroundPosition: '16px 0' } },
              'arrow-travel-x': {
                '0%, 100%': { transform: 'translateX(0)', opacity: '0.4' },
                '50%': { transform: 'translateX(6px)', opacity: '1' },
              },
            },
            animation: {
              'march-x': 'march-x 0.5s linear infinite',
              'arrow-travel-x': 'arrow-travel-x 1s ease-in-out infinite',
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
