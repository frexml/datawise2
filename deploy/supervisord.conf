; Runs as the non-root `app` user (set via Docker USER) — pidfile/logfile
; paths below all live under /tmp since /var/run and /var/log aren't
; writable by that user.
[supervisord]
nodaemon=true
pidfile=/tmp/supervisor/supervisord.pid
logfile=/tmp/supervisor/supervisord.log
logfile_maxbytes=0

[program:backend]
command=/opt/venv/bin/uvicorn dsxlineage.main:app --host 127.0.0.1 --port 8000
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
