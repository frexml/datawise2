version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 12G
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dsx_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo-preview}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-devpassword123}
    depends_on:
      - db
      - redis
      - neo4j
    volumes:
      - .:/app
      - ./data/end_to_end_linage:/app/end_to_end_linage:ro

  frontend:
    build:
      context: ./frontend
      target: build           # use Node build stage for hot-reload dev
    command: ["npm", "run", "dev", "--", "--host"]
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  celery_worker:
    build: .
    command: celery -A dsxlineage.worker.celery_app worker --loglevel=info
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dsx_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-devpassword123}
      - OPENMETADATA_API_URL=http://openmetadata_server:8585/api/v1
      - OPENMETADATA_UI_URL=${OPENMETADATA_UI_URL:-http://localhost:8585}
    depends_on:
      - db
      - redis
      - neo4j
      - openmetadata_server
    volumes:
      - .:/app
      - ./data/end_to_end_linage:/app/end_to_end_linage:ro

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dsx_db
    ports:
      # Host:container — host port 5433 to avoid clashing with other local
      # Postgres instances. Backend talks to `db:5432` via the compose network.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-devpassword123}
    ports:
      - "7474:7474" # browser UI — dev convenience only
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data

  # --- Open-source Data Governance Catalog (OpenMetadata) ---
  # Push-only usage: DataWise pushes tables/pipelines/lineage via the REST
  # API on review approval. No scheduled connectors are configured, but the
  # ingestion (Airflow) container ships as part of OpenMetadata's own
  # supported compose topology, so it's kept even though nothing schedules
  # jobs through it here.
  # Despite the image name ("db"), openmetadata/db is a plain MySQL 8 image
  # (confirmed by inspecting the running container) — standard MYSQL_* env
  # vars apply, not POSTGRES_*.
  openmetadata_mysql:
    image: openmetadata/db:1.12.6
    environment:
      - MYSQL_ROOT_PASSWORD=openmetadata_root_password
      - MYSQL_DATABASE=openmetadata_db
      - MYSQL_USER=openmetadata_user
      - MYSQL_PASSWORD=openmetadata_password
    volumes:
      - openmetadata_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-popenmetadata_root_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  openmetadata_elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.3
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - openmetadata_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot schema/index migration. openmetadata_server's own entrypoint
  # does NOT run this — a fresh openmetadata_mysql_data volume crash-loops
  # forever on "Table 'openmetadata_db.ACT_GE_PROPERTY' doesn't exist"
  # without it. Runs on every `docker compose up`, not just first boot:
  # openmetadata-ops.sh migrate checks the applied-migrations table and
  # no-ops in a few seconds when the schema is already current, so this is
  # safe and cheap to rerun on a volume that survived a teardown too.
  openmetadata_migrate:
    image: openmetadata/server:1.12.6
    environment:
      - DB_DRIVER_CLASS=com.mysql.cj.jdbc.Driver
      - DB_SCHEME=mysql
      - DB_USE_SSL=false
      - DB_USER=openmetadata_user
      - DB_USER_PASSWORD=openmetadata_password
      - DB_HOST=openmetadata_mysql
      - DB_PORT=3306
      - OM_DATABASE=openmetadata_db
      - ELASTICSEARCH_HOST=openmetadata_elasticsearch
      - ELASTICSEARCH_PORT=9200
    command: ["/opt/openmetadata/bootstrap/openmetadata-ops.sh", "migrate"]
    restart: "no"
    depends_on:
      openmetadata_mysql:
        condition: service_healthy

  openmetadata_server:
    image: openmetadata/server:1.12.6
    environment:
      - DB_DRIVER_CLASS=com.mysql.cj.jdbc.Driver
      - DB_SCHEME=mysql
      - DB_USE_SSL=false
      - DB_USER=openmetadata_user
      - DB_USER_PASSWORD=openmetadata_password
      - DB_HOST=openmetadata_mysql
      - DB_PORT=3306
      - OM_DATABASE=openmetadata_db
      - ELASTICSEARCH_HOST=openmetadata_elasticsearch
      - ELASTICSEARCH_PORT=9200
      - AIRFLOW_HOST=openmetadata_ingestion
      - SERVER_HOST_API_URL=http://openmetadata_server:8585/api
    ports:
      - "8585:8585"
      - "8586:8586"
    depends_on:
      openmetadata_mysql:
        condition: service_healthy
      openmetadata_elasticsearch:
        condition: service_healthy
      openmetadata_migrate:
        condition: service_completed_successfully

  openmetadata_ingestion:
    image: openmetadata/ingestion:1.12.6
    environment:
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - DB_HOST=openmetadata_mysql
      - DB_PORT=3306
    ports:
      - "8080:8080"
    depends_on:
      - openmetadata_server

volumes:
  postgres_data:
  neo4j_data:
  openmetadata_mysql_data:
  openmetadata_es_data:
